kind = "web"
previewPath = "/"
title = "AdClaw AI"
version = "1.0.0"
id = "artifacts/adclaw-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23476

[services.development]
run = "pnpm --filter @workspace/adclaw-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/adclaw-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/adclaw-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23476"
BASE_PATH = "/"
