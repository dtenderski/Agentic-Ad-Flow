openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AdClaw AI - Agentic Meta Ads Blueprint & Conversion Engine API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: businesses
    description: Business profile management
  - name: products
    description: Product and offer management
  - name: campaigns
    description: Campaign management
  - name: adsets
    description: Ad set management
  - name: creatives
    description: Ad creative management
  - name: pipeline
    description: AI pipeline orchestration
  - name: blueprints
    description: Generated ad blueprints
  - name: approvals
    description: Human approval gate
  - name: memory
    description: Agent memory and learning
  - name: dashboard
    description: Dashboard summary and analytics
  - name: meta
    description: Meta Ads API integration
  - name: copilot
    description: AI Copilot scheduled reports and commands

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Dashboard ───────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard overview
      description: Returns aggregate stats across campaigns, creatives, and pipeline runs
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/recent-campaigns:
    get:
      operationId: getRecentCampaigns
      tags: [dashboard]
      summary: Get recent campaigns
      description: Returns the most recently active/created campaigns
      responses:
        "200":
          description: List of recent campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"

  /dashboard/pipeline-activity:
    get:
      operationId: getPipelineActivity
      tags: [dashboard]
      summary: Get recent pipeline activity
      description: Returns recent pipeline runs with their statuses
      responses:
        "200":
          description: Pipeline activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PipelineRun"

  # ─── Businesses ──────────────────────────────────────────────────────────────
  /businesses:
    get:
      operationId: listBusinesses
      tags: [businesses]
      summary: List all business profiles
      responses:
        "200":
          description: List of businesses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Business"
    post:
      operationId: createBusiness
      tags: [businesses]
      summary: Create a new business profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessInput"
      responses:
        "201":
          description: Business created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"

  /businesses/{businessId}:
    get:
      operationId: getBusiness
      tags: [businesses]
      summary: Get a business profile
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Business profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "404":
          description: Not found
    patch:
      operationId: updateBusiness
      tags: [businesses]
      summary: Update a business profile
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessUpdate"
      responses:
        "200":
          description: Business updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
    delete:
      operationId: deleteBusiness
      tags: [businesses]
      summary: Delete a business profile
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Products ─────────────────────────────────────────────────────────────────
  /businesses/{businessId}/products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products for a business
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product for a business
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{productId}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Pipeline (AI Orchestration) ─────────────────────────────────────────────
  /pipeline/run:
    post:
      operationId: runPipeline
      tags: [pipeline]
      summary: Run the MultiClaw-OpenClaw AI pipeline
      description: Triggers the AI agents pipeline to generate a full ads blueprint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipelineInput"
      responses:
        "201":
          description: Pipeline started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineRun"

  /pipeline:
    get:
      operationId: listPipelineRuns
      tags: [pipeline]
      summary: List all pipeline runs
      responses:
        "200":
          description: List of pipeline runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PipelineRun"

  /pipeline/{pipelineId}:
    get:
      operationId: getPipelineRun
      tags: [pipeline]
      summary: Get a pipeline run and its results
      parameters:
        - name: pipelineId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pipeline run details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineRunDetail"
        "404":
          description: Not found

  # ─── Blueprints ───────────────────────────────────────────────────────────────
  /blueprints:
    get:
      operationId: listBlueprints
      tags: [blueprints]
      summary: List all generated blueprints
      responses:
        "200":
          description: List of blueprints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Blueprint"

  /blueprints/{blueprintId}:
    get:
      operationId: getBlueprint
      tags: [blueprints]
      summary: Get a blueprint
      parameters:
        - name: blueprintId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Blueprint with full content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blueprint"
        "404":
          description: Not found

  # ─── Campaigns ────────────────────────────────────────────────────────────────
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List all campaigns
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a campaign draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /campaigns/{campaignId}:
    get:
      operationId: getCampaign
      tags: [campaigns]
      summary: Get a campaign
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "404":
          description: Not found
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Update a campaign
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignUpdate"
      responses:
        "200":
          description: Campaign updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Delete a campaign
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /campaigns/{campaignId}/approve:
    post:
      operationId: approveCampaign
      tags: [campaigns, approvals]
      summary: Approve a campaign (human gate)
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecision"
      responses:
        "200":
          description: Campaign approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /campaigns/{campaignId}/adsets:
    get:
      operationId: listAdSets
      tags: [adsets]
      summary: List ad sets for a campaign
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of ad sets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdSet"
    post:
      operationId: createAdSet
      tags: [adsets]
      summary: Create an ad set for a campaign
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdSetInput"
      responses:
        "201":
          description: Ad set created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdSet"

  /adsets/{adsetId}:
    get:
      operationId: getAdSet
      tags: [adsets]
      summary: Get an ad set
      parameters:
        - name: adsetId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ad set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdSet"
        "404":
          description: Not found
    patch:
      operationId: updateAdSet
      tags: [adsets]
      summary: Update an ad set
      parameters:
        - name: adsetId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdSetUpdate"
      responses:
        "200":
          description: Ad set updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdSet"
    delete:
      operationId: deleteAdSet
      tags: [adsets]
      summary: Delete an ad set
      parameters:
        - name: adsetId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /adsets/{adsetId}/creatives:
    get:
      operationId: listCreatives
      tags: [creatives]
      summary: List creatives for an ad set
      parameters:
        - name: adsetId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of creatives
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Creative"
    post:
      operationId: createCreative
      tags: [creatives]
      summary: Create a creative for an ad set
      parameters:
        - name: adsetId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreativeInput"
      responses:
        "201":
          description: Creative created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Creative"

  /creatives/{creativeId}:
    get:
      operationId: getCreative
      tags: [creatives]
      summary: Get a creative
      parameters:
        - name: creativeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Creative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Creative"
        "404":
          description: Not found
    patch:
      operationId: updateCreative
      tags: [creatives]
      summary: Update a creative
      parameters:
        - name: creativeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreativeUpdate"
      responses:
        "200":
          description: Creative updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Creative"
    delete:
      operationId: deleteCreative
      tags: [creatives]
      summary: Delete a creative
      parameters:
        - name: creativeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Approvals ────────────────────────────────────────────────────────────────
  /approvals:
    get:
      operationId: listApprovals
      tags: [approvals]
      summary: List all pending approvals
      responses:
        "200":
          description: List of approvals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Approval"

  # ─── Agent Memory ─────────────────────────────────────────────────────────────
  /memory:
    get:
      operationId: listMemories
      tags: [memory]
      summary: List agent memories
      responses:
        "200":
          description: List of agent memories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentMemory"

  /memory/{businessId}:
    get:
      operationId: getBusinessMemory
      tags: [memory]
      summary: Get agent memory for a business
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Agent memory for business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentMemory"
        "404":
          description: Not found

  # ─── Meta Ads API ─────────────────────────────────────────────────────────────
  /meta/interests/search:
    get:
      tags: [meta]
      operationId: searchMetaInterests
      summary: Search Meta interest targeting options
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Interest search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaInterestSearchResult"

  /meta/token/info:
    get:
      tags: [meta]
      operationId: getMetaTokenInfo
      summary: Get Meta access token health and expiry info
      responses:
        "200":
          description: Token info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaTokenInfo"

  /meta/token/refresh:
    post:
      tags: [meta]
      operationId: refreshMetaToken
      summary: Exchange current token for a fresh long-lived token (60 days)
      responses:
        "200":
          description: New token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaTokenRefreshResult"
        "500":
          description: Refresh failed

  /meta/insights/account:
    get:
      tags: [meta]
      operationId: getMetaAccountInsights
      summary: Get account-level ad performance insights
      parameters:
        - name: datePreset
          in: query
          required: false
          schema:
            type: string
            default: last_7d
      responses:
        "200":
          description: Account insight metrics, or null when no campaigns ran in the period
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MetaAccountInsight"
                  - type: "null"

  /meta/insights/campaign:
    get:
      tags: [meta]
      operationId: getMetaCampaignInsights
      summary: Get per-campaign ad performance insights from Meta
      parameters:
        - name: campaignId
          in: query
          required: true
          schema:
            type: integer
        - name: datePreset
          in: query
          required: false
          schema:
            type: string
            default: last_7d
      responses:
        "200":
          description: Campaign insight metrics, or null when campaign has no data in the period
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MetaCampaignInsight"
                  - type: "null"
        "400":
          description: Campaign not pushed to Meta yet
        "404":
          description: Campaign not found

  /meta/validate:
    get:
      tags: [meta]
      operationId: validateMeta
      summary: Validate Meta Ads credentials
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaValidationResult"

  /meta/push/{campaignId}:
    post:
      tags: [meta]
      operationId: pushToMeta
      summary: Push approved campaign to Meta Ads Manager
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Push result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaPushResult"
        "400":
          description: Campaign not approved or invalid
        "404":
          description: Campaign not found
        "500":
          description: Meta API error

  # ─── Copilot ─────────────────────────────────────────────────────────────────
  /copilot/reports:
    get:
      tags: [copilot]
      operationId: listCopilotReports
      summary: List recent Copilot reports (last 20)
      responses:
        "200":
          description: List of copilot reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CopilotReport"

  /copilot/generate-brief:
    post:
      tags: [copilot]
      operationId: generateCopilotBrief
      summary: Manually trigger morning trend brief generation
      responses:
        "200":
          description: Generated brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotGenerateResult"
        "500":
          description: Generation failed

  /copilot/generate-report:
    post:
      tags: [copilot]
      operationId: generateCopilotReport
      summary: Manually trigger afternoon performance report generation
      responses:
        "200":
          description: Generated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotGenerateResult"
        "500":
          description: Generation failed

  /copilot/command:
    post:
      tags: [copilot]
      operationId: runCopilotCommand
      summary: Send a natural-language command to AdClaw Copilot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopilotCommandInput"
      responses:
        "200":
          description: Command result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotCommandResult"
        "400":
          description: Missing message
        "500":
          description: Command failed

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ─── Dashboard ──────────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [totalBusinesses, totalCampaigns, totalBlueprints, pendingApprovals, activeCampaigns, draftCampaigns, pipelineRunsToday, conversionReadinessAvg]
      properties:
        totalBusinesses:
          type: integer
        totalCampaigns:
          type: integer
        totalBlueprints:
          type: integer
        pendingApprovals:
          type: integer
        activeCampaigns:
          type: integer
        draftCampaigns:
          type: integer
        pipelineRunsToday:
          type: integer
        conversionReadinessAvg:
          type: number

    # ─── Business ───────────────────────────────────────────────────────────────
    Business:
      type: object
      required: [id, businessName, industry, createdAt]
      properties:
        id:
          type: integer
        businessName:
          type: string
        industry:
          type: string
        productCategory:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        whatsapp:
          type: ["string", "null"]
        targetMarket:
          type: ["string", "null"]
        valueProposition:
          type: ["string", "null"]
        brandVoice:
          type: ["string", "null"]
        complianceNotes:
          type: ["string", "null"]
        createdAt:
          type: string

    BusinessInput:
      type: object
      required: [businessName, industry]
      properties:
        businessName:
          type: string
          minLength: 1
        industry:
          type: string
          minLength: 1
        productCategory:
          type: string
        location:
          type: string
        website:
          type: string
        whatsapp:
          type: string
        targetMarket:
          type: string
        valueProposition:
          type: string
        brandVoice:
          type: string
        complianceNotes:
          type: string

    BusinessUpdate:
      type: object
      properties:
        businessName:
          type: string
        industry:
          type: string
        productCategory:
          type: string
        location:
          type: string
        website:
          type: string
        whatsapp:
          type: string
        targetMarket:
          type: string
        valueProposition:
          type: string
        brandVoice:
          type: string
        complianceNotes:
          type: string

    # ─── Product ─────────────────────────────────────────────────────────────────
    Product:
      type: object
      required: [id, businessId, productName, createdAt]
      properties:
        id:
          type: integer
        businessId:
          type: integer
        productName:
          type: string
        description:
          type: ["string", "null"]
        price:
          type: ["number", "null"]
        promo:
          type: ["string", "null"]
        benefit:
          type: ["string", "null"]
        painPoint:
          type: ["string", "null"]
        proof:
          type: ["string", "null"]
        guarantee:
          type: ["string", "null"]
        cta:
          type: ["string", "null"]
        landingPageUrl:
          type: ["string", "null"]
        createdAt:
          type: string

    ProductInput:
      type: object
      required: [productName]
      properties:
        productName:
          type: string
          minLength: 1
        description:
          type: string
        price:
          type: number
        promo:
          type: string
